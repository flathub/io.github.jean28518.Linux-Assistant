app-id: io.github.jean28518.Linux-Assistant
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: linux-assistant
rename-icon: linux-assistant
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --filesystem=host
  - --share=network
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: linux-assistant
    buildsystem: simple
    build-commands:
      - install -Dm0644 flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm0644 flatpak/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm0644 linux-assistant.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm0755 linux-assistant -t /app/bin/
      - install -Dm0755 version -t /app/bin/
      - cp -r data /app/bin/data
      - cp -r lib /app/bin/lib
      - cp -r lib /app/lib
      - cp -r additional /app/bin/additional
    sources:
      - type: archive
        url: https://github.com/Jean28518/linux-assistant/releases/download/v0.6.1/linux-assistant-bundle.zip
        sha256: 23f428235a0564954a0c2a389e7c35407817c6289212edb309af51ce474930a3
      - type: patch
        path: fix-appdata.patch
